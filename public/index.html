<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yakton Games</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Yakton Games</h1><input id="q" type="search" placeholder="Search games" aria-label="Search games"></header>
<div class="line"></div>
<main>
  <section id="stage" hidden>
    <h2 id="gt"></h2>
    <p id="help"></p>
    <div id="game"></div>
    <p id="st" aria-live="polite"></p>
    <div class="bar"><button id="again" type="button">Restart</button><button id="fs" type="button">Fullscreen</button><button id="back" type="button">Back to games</button></div>
  </section>
  <div id="chips"></div>
  <div id="grid"></div>
</main>
<script src="games.js"></script>
<script src="cars.js"></script>
<script src="boot.js"></script>
</body>
</html>
